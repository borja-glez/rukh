name: ml

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: lint and unit tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # `hf` as well as `cpu`: without it the Hugging Face tests skip, and one of them is the
      # only check that the hand-written LoRA of `rukh.models.lora` is the same update rule as
      # `peft`'s. A claim that is verified on one laptop is not verified.
      - name: Sync (CPU torch, Hugging Face extra, dev group)
        run: uv sync --extra cpu --extra hf --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m unit -q
