name: ml

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: lint and unit tests (CPU)
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 from 2026-10-19, and the CPU
    # wheel that `uv sync` resolves and the cache key it builds both depend on the distribution.
    # Move it on purpose, with a run that proves the environment still resolves.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # An exact version, not a `v10`: setup-uv stopped publishing moving major tags at v8,
      # on purpose, so that a compromised tag cannot be repointed at other code.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # `hf` as well as `cpu`: without it the Hugging Face tests skip, and one of them is the
      # only check that the hand-written LoRA of `rukh.models.lora` is the same update rule as
      # `peft`'s. A claim that is verified on one laptop is not verified.
      - name: Sync (CPU torch, Hugging Face extra, dev group)
        run: uv sync --extra cpu --extra hf --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m unit -q
