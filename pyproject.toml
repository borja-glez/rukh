[project]
name = "rukh"
version = "0.0.1"
description = "Rukh: a chess language model built from scratch (data, training, evaluation, agents)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.27",
  "pydantic>=2.13",
  "pyyaml>=6",
  "mlflow>=3.16",
  "python-chess>=1.999",
  "duckdb>=1.5",
  "polars>=1.44",
  "pyarrow>=25",
  "zstandard>=0.25",
  "numpy>=2",
  "huggingface_hub>=1.32",
  "datasets>=5",
]

[project.optional-dependencies]
cpu = ["torch>=2.11,<2.12"]
cu128 = ["torch>=2.11,<2.12"]

[project.scripts]
rukh = "rukh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rukh"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "pytest-cov"]

[tool.pytest.ini_options]
markers = [
  "unit: fast CPU tests",
  "gpu: needs CUDA",
  "slow: long",
  "engine: needs Stockfish binary",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
