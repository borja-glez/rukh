[project]
name = "rukh"
version = "0.0.1"
description = "Rukh: a chess language model built from scratch (data, training, evaluation, agents)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Borja González" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.27",
  "pydantic>=2.13",
  "pyyaml>=6",
  "mlflow>=3.16",
  "python-chess>=1.999",
  "duckdb>=1.5",
  "polars>=1.44",
  "pyarrow>=25",
  "zstandard>=0.25",
  "numpy>=2",
  "huggingface_hub>=1.32",
  "datasets>=5",
  "tokenizers>=0.22",
  "jinja2>=3.1",
  "requests>=2.32",
  "onnx>=1.23",
  "onnxscript>=0.6",
  "onnxruntime>=1.30",
  "onnxconverter-common>=1.16",
  "safetensors>=0.6",
]

[project.optional-dependencies]
cpu = ["torch>=2.11,<2.12"]
cu128 = ["torch>=2.11,<2.12"]
# The Hugging Face training stack, needed only by M4: the `PreTrainedModel` wrapper around
# `MoveDecoder`, `peft` as the reference LoRA the hand-written one is checked against, and the
# QLoRA fine-tune of Qwen3 on PGN. It is an extra and not a core dependency because the CPU CI
# job has a three-minute budget and nothing in P0-P3 imports any of it.
hf = ["transformers>=5.17", "peft>=0.21", "trl>=1.13", "accelerate>=1.15"]

[project.urls]
Repository = "https://github.com/borja-glez/rukh"
Course = "https://lab.rukh.borjaglez.com"
Demo = "https://rukh.borjaglez.com"
Models = "https://huggingface.co/chorcat"

[project.scripts]
rukh = "rukh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rukh"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16"]

[tool.pytest.ini_options]
markers = [
  "unit: fast CPU tests",
  "gpu: needs CUDA",
  "slow: long",
  "engine: needs Stockfish binary",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Lab scripts mirror the code blocks of the lessons verbatim; a couple of rules that fight
# readability in teaching material are relaxed there.
"labs/**" = ["SIM905"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `helpers_labels` is the test suite's own module (tests/unit is on sys.path, see the file):
# without this ruff sorts it among the third-party packages and the import block never settles.
known-first-party = ["rukh", "helpers_labels"]
