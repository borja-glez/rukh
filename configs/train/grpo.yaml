# GRPO against a verifiable reward. No preference pairs and no reward model: only the positions
# are read out of the pairs file, and the labels in it are ignored.
prompts: data/pairs/dpo-prompts.parquet
checkpoint: checkpoints/medium-v4/best.pt
out_dir: checkpoints
run_name: medium-v4-grpo

# Eight candidates per position, which is what makes the group's mean a usable baseline. Their
# spread is the entire learning signal, so this is the knob that decides how much of the engine
# budget turns into a gradient and how much is spent on groups that all agree.
group_size: 8

# Temperature 1.0, and the measurement that says this is not a free lever. Raising it buys
# diversity -- 38 % of groups are flat at 1.0, 26 % at 1.3, 19 % at 1.6 -- and charges for it in
# engine calls, so the price per *useful* group barely moves: 0.184, 0.186 and 0.174 groups per
# analysis. With the cost flat, the tie-break is on-policy-ness, and 1.0 is closest to how the
# model is read.
temperature: 1.0
top_k: 20

# Only moves that can be played here. The legality gate then never fires, which is fine: the demo
# masks illegal moves before they reach the board. Set it to false to let the gate teach --
# `grpo-legality.yaml` is the run that does.
restrict_to_legal: true

# The KL term against the frozen start. The reward is verifiable, which means it is exactly
# specifiable and therefore exactly gameable: this is what stops the policy from walking off to
# whatever corner of move-space scores best.
beta_kl: 0.02

lr: 1.0e-6
positions_per_step: 8
steps: 300

# Depth 8 per candidate, and a persistent cache so the second visit to a position is free.
# The engine is the whole cost of this run; the model is almost an afterthought.
depth: 8
cache: artifacts/grpo-engine-cache.json

val_positions: 200

# The reward's weights, written down so the run can be rebuilt from its config alone.
weights:
  quality: 1.0
  mate: 0.25
  repetition: 0.25
  cp_scale: 200.0

seed: 42
