# `small` (12 layers, d=512, ~39M parameters): the course model, 4-8 hours on a 5090.
preset: small
tokens_dir: data/tokens/uci
block: 200
batch_size: 64
grad_accum: 4 # 256 effective sequences of 200 tokens
lr: 6.0e-4
min_lr_ratio: 0.1
warmup: 1000
max_steps: 20000
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
precision: bf16
compile: true
eval_every: 500
eval_batches: 50
ckpt_every: 1000
out_dir: checkpoints
seed: 42
run_name: small
# A timestamp is appended: a second run must not overwrite the step-*.pt series.
unique_run_name: true
workers: 4
log_every: 10
