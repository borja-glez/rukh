# `medium-v4` fine-tuned on masters only: the trade `docs/spec/02` predicts, measured.
#
# "Seguir preentrenando con rukh-games-elite (lr 1e-4). Medir: sube el Elo, baja la diversidad."
# Both halves need a number. The Elo comes from the usual suite; the diversity is the opening
# entropy `rukh.eval.diversity` measures, which was `n/a` in every report before this milestone
# precisely because nothing had needed it yet.
#
# The token budget is the same as `medium-elo`'s (3 800 steps of 51 200 tokens, 194.6 M) so the
# two fine-tunes differ in their corpus and in nothing else. Against the 1.05 B tokens of the
# elite pack that is 0.18 of an epoch: a fine-tune, not a second pretraining.
preset: medium
init_from: checkpoints/medium-v4-20260919-174623/best.pt
tokens_dir: data/tokens-masters/uci
block: 200
batch_size: 32
grad_accum: 8
lr: 1.0e-4
min_lr_ratio: 0.1
warmup: 200
max_steps: 3800
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
precision: bf16
compile: true
eval_every: 200
eval_batches: 50
ckpt_every: 500
out_dir: checkpoints
seed: 42
run_name: medium-masters
unique_run_name: true
workers: 4
log_every: 10
