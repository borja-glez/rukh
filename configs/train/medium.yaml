# `medium` (16 layers, d=768, 115,120,128 parameters): the escalation `docs/spec/08` allows when
# `small` falls short of the 1200 Elo bar. `small` measured 1007 Elo (CI 920-1101) at near-greedy
# sampling, so this run exists to answer whether capacity or data is the binding constraint.
# Three times the compute of `small` at the same token budget: expect around two hours on a 5090.
preset: medium
tokens_dir: data/tokens/uci
block: 200
batch_size: 32
grad_accum: 8 # 256 effective sequences of 200 tokens
lr: 4.5e-4
min_lr_ratio: 0.1
warmup: 1000
max_steps: 20000
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
precision: bf16
compile: true
eval_every: 500
eval_batches: 50
ckpt_every: 1000
out_dir: checkpoints
seed: 42
run_name: medium
unique_run_name: true
workers: 4
log_every: 10
