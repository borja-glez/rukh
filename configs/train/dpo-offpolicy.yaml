# DPO on the pairs Lichess's evaluations produced: off-policy, and the control arm of M5's
# comparison. The only lines that differ from `dpo-onpolicy.yaml` are `pairs` and `max_pairs`.
pairs: data/pairs/dpo-prompts.parquet
# Matched to the on-policy pair count (6 386), as a fixed-seed sample of the whole file, so the
# two arms see the same amount of data and the comparison measures the source of the pairs and
# not their number. P5 did this with a one-off script that wrote `data/pairs-offpolicy-matched/`;
# the config now says it, so the run can be rebuilt from the config alone.
max_pairs: 6386
checkpoint: checkpoints/medium-v4/best.pt
out_dir: checkpoints
run_name: medium-v4-dpo-offpolicy

# beta is the distance the policy is allowed to travel from its frozen reference. 0.1 is the
# published default and the one P5 measured at +40 Elo head-to-head against the base model.
beta: 0.1
lr: 5.0e-6

# A little next-token loss on the chosen move. Pure DPO can raise the margin while the model
# forgets how to play at all: the margin says "chosen beats rejected", not "chosen is good".
nll_weight: 0.1

batch_size: 32
epochs: 1
val_fraction: 0.1
seed: 42
