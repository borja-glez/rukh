# `small` retrained on the recovered corpus (D-062): 471 M unique tokens instead of 240 M, so
# 12.1 tokens per parameter instead of 6.2. 28,000 steps is 1.43 B tokens seen, three passes over
# the data rather than the 4.3 of the first run -- more compute *and* less repetition at once.
# Target: val/loss <= 1.42, the level the three measured stages put at about 1200 Elo.
preset: small
tokens_dir: data/tokens-v2/uci
block: 200
batch_size: 64
grad_accum: 4 # 256 effective sequences of 200 tokens
lr: 6.0e-4
min_lr_ratio: 0.1
warmup: 1000
max_steps: 28000
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
precision: bf16
compile: true
eval_every: 500
eval_batches: 50
ckpt_every: 1000
out_dir: checkpoints
seed: 42
run_name: small-v2
unique_run_name: true
workers: 4
log_every: 10
