# The wide suite of P2: ten times the positions and five times the games per Elo rung, sampled at
# `temperature: 0.6`. It is a deeper look at one checkpoint, and it is **not** what the results
# table holds -- every published row was measured with `configs/eval/greedy.yaml`, at
# `temperature: 0.05, top_k: 1`, which is worth about 180 Elo on the same weights (D-047). Two
# rows only compare if the config did not move, so this file no longer writes `web_results`:
# pointing it at the table is how the table came to carry rows nothing else could be compared to.
# Hours of Stockfish games; the SQLite cache makes a re-run cheap.
games: data/uci/year=2025/month=02/games.parquet
puzzles: data/puzzles/puzzles.parquet
puzzle_split: test
legality_positions: 10000
accuracy_positions: 10000
position_pool: 50000
puzzles_per_band: 2000
elo_games: 100
# 0.1 s per move: below that `UCI_Elo` is not calibrated at all (D-025).
elo_move_time: 0.1
bootstrap: 1000
temperature: 0.6
top_k: 20
block: 200
seed: 42
out_dir: artifacts/eval
# Deliberately not `artifacts/web/results.json`: see the header.
web_results: null
cache_db: artifacts/eval/cache.sqlite
# device: null -> CUDA when it is available (rukh.train.pick_device)
track: true
