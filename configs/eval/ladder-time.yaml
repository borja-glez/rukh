# The ladder on the clock, run for the instrument and not for the table.
#
# M6 measures how well the ladder repeats itself before rebuilding the results table with it.
# Two runs of this file on the same weights, with the cache off, are two independent draws of
# the instrument as P4 knew it: Stockfish on 0.1 s per move with `UCI_LimitStrength`, which
# gave 1498 and 1558 for the same model and seed (D-107). Everything else is `greedy.yaml`.
#
# `web_results: null` on purpose: these runs are the instrument being measured, not a stage, and
# a row for them in the single table would be a number about nothing.
games: data/uci/year=2025/month=02/games.parquet
puzzles: data/puzzles/puzzles.parquet
puzzle_split: test
legality_positions: 0
accuracy_positions: 0
position_pool: 20000
puzzles_per_band: 0
elo_games: 20
elo_move_time: 0.1
bootstrap: 500
diversity_games: 0
temperature: 0.05
top_k: 1
block: 200
seed: 42
header_elo: 1800
out_dir: artifacts/eval
web_results: null
cache_db: artifacts/eval/cache-ladder.sqlite
track: false
