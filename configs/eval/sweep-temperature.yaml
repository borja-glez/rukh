# The sweep again, sampling the distribution instead of its mode.
#
# The whole suite plays at `temperature: 0.05, top_k: 1`, which is the mode: the model always makes
# its most likely move. And the difference between a 1200 and a 2400 is not in the mode -- both
# play the obvious recapture -- but in the tail, in how often they pick something bad. The
# milestone's own data says so: first-move entropy, which reads the whole distribution, is
# monotonic across the six conditions; the puzzles and the Elo, which read the mode, are flat.
#
# So this run changes exactly one thing against `greedy-sweep.yaml`: it samples at temperature 1.0
# with top-k 20, the "human" setting of the demo. If the gap between `<w1200>` and `<w2400>` opens,
# the header does control strength and what was missing was to stop sampling the peak. If it comes
# out flat, that is a second null result and it says something too.
#
# It replaces nothing published: D-047 fixes the near-deterministic sampling as the one every
# number of this project is read at, so this is a separate measurement, with its own cache, and it
# is published saying which temperature it was read at.

games: data/uci/year=2025/month=02/games.parquet
puzzles: data/puzzles/puzzles.parquet
puzzle_split: test
legality_positions: 1000
accuracy_positions: 1000
position_pool: 20000
puzzles_per_band: 2000
force_header: true
elo_games: 20
elo_move_time: 0.1
bootstrap: 500
temperature: 1.0
top_k: 20
block: 200
seed: 42
header_elo: 1800
diversity_games: 200
diversity_plies: 12
diversity_temperature: 1.0
diversity_top_k: 20
out_dir: artifacts/eval
web_results: null
cache_db: artifacts/eval/cache-sweep-t1.sqlite
track: false
