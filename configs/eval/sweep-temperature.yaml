# El barrido otra vez, muestreando la distribución en vez de su moda.
#
# Toda la suite juega con `temperature: 0.05, top_k: 1`, que es la moda: el modelo hace siempre su
# jugada más probable. Y la diferencia entre un 1200 y un 2400 no está en la moda -- los dos hacen
# la recaptura obvia -- sino en la cola, en cada cuánto eligen algo malo. Los datos del hito lo
# dicen solos: la entropía de la primera jugada, que lee la distribución entera, es monótona en las
# seis condiciones; los puzles y el Elo, que leen la moda, son planos.
#
# Así que esta tirada cambia una sola cosa respecto de `greedy-sweep.yaml`: muestrea a temperatura
# 1,0 con top-k 20, que es el ajuste "humano" de la demo. Si la brecha entre `<w1200>` y `<w2400>`
# se abre, la cabecera controla la fuerza y lo que faltaba era dejar de muestrear el pico. Si sale
# plana, es un segundo resultado nulo y también dice algo.
#
# NO sustituye a nada publicado: D-047 fija el muestreo casi determinista como el de todos los
# números del proyecto, así que esto es una medición aparte, con su caché aparte, y se publica
# diciendo a qué temperatura se leyó.

games: data/uci/year=2025/month=02/games.parquet
puzzles: data/puzzles/puzzles.parquet
puzzle_split: test
legality_positions: 1000
accuracy_positions: 1000
position_pool: 20000
puzzles_per_band: 2000
force_header: true
