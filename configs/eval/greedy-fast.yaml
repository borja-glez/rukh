# `greedy.yaml` without the Stockfish ladder: everything that does not need an engine.
#
# For the stages where the question is "did this damage the model?" rather than "how strong is
# it?": the style adapters of M4. Legality, next-move accuracy and puzzles all answer the first
# question, cost minutes instead of an hour, and puzzles in particular track playing strength
# closely enough to catch an adapter that broke something (in D-072 they moved 22 -> 37 % across
# a 145-Elo gap).
#
# What it cannot do is replace an Elo. A stage measured with this file has no rating and its card
# says so; it does not borrow one from its base model.
games: data/uci/year=2025/month=02/games.parquet
puzzles: data/puzzles/puzzles.parquet
puzzle_split: test
legality_positions: 1000
accuracy_positions: 1000
position_pool: 20000
puzzles_per_band: 2000
elo_games: 0
elo_move_time: 0.1
bootstrap: 500
temperature: 0.05
top_k: 1
block: 200
seed: 42
header_elo: 1800
diversity_games: 200
diversity_plies: 12
diversity_temperature: 1.0
diversity_top_k: 20
out_dir: artifacts/eval
web_results: artifacts/web/results.json
cache_db: artifacts/eval/cache-greedy.sqlite
track: false
