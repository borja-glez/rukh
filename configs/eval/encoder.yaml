# Encoder suite (the design spec 02, component 2): blunder detection against the material baseline,
# the correlation of the value head with Stockfish's `cp`, and the accuracy of the result head.
# Everything is measured on the held-out split of `rukh.data.labels`, which is drawn by game.
stage: null # defaults to the checkpoint's run directory
split: val # never `train` for a published number
positions: 10000 # 0 evaluates the whole split
batch_size: 256
# The fixed operating point, reported next to the tuned one and never as the headline: a
# blunder is ~3.7 % of the rows and the head's sigmoid is not calibrated, so the F1 at 0.5
# measures the threshold rather than the model. The reported F1 uses the threshold that
# maximises F1 on the `tune` half of the labelled rows (split by game_id, like everything
# else here) and is measured on the `score` half, together with ROC AUC and average precision.
threshold: 0.5 # probability above which the blunder logit counts as a blunder
# The baseline of docs/acceptance.md: material (1/3/3/5/9) plus mobility, one ply of captures ahead.
mobility_weight: 0.05
blunder_material: 1.0
labels:
  positions_eval: data/evals/positions-eval.parquet
  out_dir: data/labels
  value_scale: 400.0
  blunder_cp: 100
  val_fraction: 0.1
  seed: 42
seed: 42
out_dir: artifacts/eval
web_results: artifacts/web/results.json
cache_db: artifacts/eval/cache.sqlite
# device: null -> CUDA when it is available (rukh.train.pick_device)
track: true
