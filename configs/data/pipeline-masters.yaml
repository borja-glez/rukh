# Token pack of the Elite Database alone, for the masters fine-tune of M4.
#
# The elite games are already part of `tokens-v4`, mixed in with the 1800+ corpus; this pack has
# nothing else in it. That is the whole experiment: `docs/spec/02` predicts that a last fine-tune
# on masters raises the Elo and lowers the diversity, and neither half of that sentence can be
# read off a corpus where masters are one ingredient among several.
#
# Same validation split as every other run -- the first 100 000 games of 2025-02 -- and its
# remainder stays out of training, so what the model is fine-tuned on is masters and only masters.
tokenize:
  uci_dir: data/uci
  out_dir: data/tokens-masters
  train_months: []
  extra_train_parquets: ['data/elite/games.parquet']
  val_month: '2025-02'
  val_games: 100000
  val_remainder_trains: false
  stats_games: data/uci/year=2025/month=01/games.parquet
  max_len: 200
